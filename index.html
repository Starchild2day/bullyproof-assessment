<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bullyproof.Guide — Get Clarity On What's Happening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#101B33;
    --gold:#C89B3C;
    --gold-soft:#EFDFB8;
    --teal:#4F7C82;
    --teal-soft:#DCEAE9;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --text:#1F2430;
    --text-muted:#5B6472;
    --border:#E1E4EA;
    --danger:#B23A48;
    --danger-bg:#FBEAEA;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -8%, rgba(27,42,74,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(200,155,60,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:24px 20px 80px;
    min-height:100vh;
  }
  header.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0 22px;
  }
  header.brand .mark{
    width:36px;height:36px;border-radius:9px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-weight:600;font-size:15px;
    font-family:'Fraunces',serif;
  }
  header.brand .name{font-weight:600;font-size:17px;color:var(--navy);letter-spacing:-0.01em;}

  .progress-track{
    position:-webkit-sticky;
    position:sticky;top:0;
    background:var(--bg);
    padding:10px 0 16px;
    z-index:20;
  }
  .progress-bar{
    height:9px;border-radius:5px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));border-radius:5px;
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{font-size:13px;color:var(--text-muted);margin-top:8px;}

  .card{
    background:var(--card);
    border-radius:16px;
    margin-top:8px;
    overflow:hidden;
    box-shadow:0 2px 16px rgba(27,42,74,0.08);
    border:1px solid var(--border);
    animation:cardIn .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .card-body{padding:26px 24px 24px;}

  .banner{
    width:100%;height:100px;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .banner.landing-banner{height:180px;}
  .banner svg{width:100%;height:100%;position:relative;z-index:1;}

  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.2;margin:0 0 14px;color:var(--navy);}
  h2.question{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.28;margin:0 0 14px;color:var(--navy);position:relative;padding-bottom:14px;}
  h2.question::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:3px;background:var(--gold);border-radius:2px;}
  p.sub{font-size:16px;color:var(--text-muted);margin:0 0 20px;}
  p.body-text{font-size:16px;color:var(--text);}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .option-btn{
    text-align:left;
    padding:15px 16px 15px 18px;
    min-height:48px;
    border-radius:11px;
    border:1.5px solid var(--border);
    border-left:4px solid var(--border);
    background:var(--card);
    font-size:16px;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    display:flex;align-items:center;gap:10px;
    transition:border-color .15s ease;
  }
  .option-btn:hover{border-color:var(--navy);border-left-color:var(--navy);}
  .option-btn.selected{border-color:var(--navy);border-left-color:var(--gold);background:#FBFAF6;font-weight:600;}
  .option-btn .check{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .option-btn.selected .check{background:var(--gold);border-color:var(--gold);animation:popIn .2s cubic-bezier(.34,1.56,.64,1);}
  .option-btn .check svg{width:11px;height:11px;opacity:0;transition:opacity .1s;}
  .option-btn.selected .check svg{opacity:1;stroke:var(--navy-deep);}
  @keyframes popIn{
    from{transform:scale(0.5);}
    to{transform:scale(1);}
  }

  .subsection{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .subsection h3{font-family:'Fraunces',serif;font-size:17px;margin:0 0 10px;color:var(--navy);font-weight:600;}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:28px;
  }
  button.primary{
    background:var(--navy);color:#fff;border:none;
    padding:14px 24px;border-radius:10px;font-size:16px;font-weight:600;
    min-height:48px;cursor:pointer;font-family:inherit;
    transition:background .15s ease;
  }
  button.primary:hover:not(:disabled){background:var(--navy-deep);}
  button.primary:disabled{background:#B7BECB;cursor:not-allowed;}
  button.ghost{
    background:transparent;border:none;color:var(--text-muted);
    font-size:15px;padding:10px;cursor:pointer;font-family:inherit;min-height:44px;font-weight:500;
  }
  button.ghost:hover{color:var(--navy);}

  input[type=email],input[type=number],input[type=text],textarea{
    width:100%;padding:14px 15px;border-radius:10px;border:1.5px solid var(--border);
    font-size:16px;font-family:inherit;color:var(--text);background:var(--card);
  }
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--navy);}

  .safety-banner{
    background:var(--danger-bg);
    border:1px solid #E9C2C6;
    border-left:4px solid var(--danger);
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
  }
  .safety-banner h3{font-family:'Fraunces',serif;color:var(--danger);margin:0 0 8px;font-size:18px;font-weight:600;}
  .safety-banner p{margin:0 0 10px;font-size:15px;color:#7A2E31;}
  .safety-banner ul{margin:0;padding-left:20px;font-size:15px;color:#7A2E31;}
  .safety-banner li{margin-bottom:4px;}
  .safety-banner a{color:var(--danger);font-weight:600;}

  .privacy-note{font-size:13px;color:var(--text-muted);margin-top:24px;line-height:1.5;}
  .privacy-note a{color:var(--navy);}

  .checkbox-row{
    display:flex;align-items:flex-start;gap:10px;padding:14px 4px;
  }
  .checkbox-row input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--navy);}
  .checkbox-row label{font-size:15px;color:var(--text);}

  .results-summary{
    background:var(--teal-soft);border-radius:12px;padding:18px 20px;margin-bottom:20px;
    border-left:4px solid var(--teal);
  }
  .results-summary h3{font-family:'Fraunces',serif;margin:0 0 8px;font-size:18px;color:var(--navy);font-weight:600;}

  .playbook-teaser{
    background:rgba(200,155,60,0.08);border-left:4px solid var(--gold);border-radius:12px;
    padding:16px 18px;margin:18px 0 4px;
  }
  .playbook-teaser h3{font-family:'Fraunces',serif;font-size:16px;margin:0 0 8px;color:var(--navy);font-weight:600;}
  .playbook-teaser p{font-size:14.5px;color:var(--text);margin:0 0 8px;line-height:1.5;}
  .playbook-teaser p:last-child{margin-bottom:0;color:var(--text-muted);}

  .network-invite{
    background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:12px;
    padding:16px 18px;margin:14px 0 4px;
  }
  .network-invite h3{font-family:'Fraunces',serif;font-size:16px;margin:0 0 8px;color:var(--navy);font-weight:600;}
  .network-invite p{font-size:14.5px;color:var(--text);margin:0 0 10px;line-height:1.5;}
  .network-invite-link{display:inline-block;color:var(--navy);font-weight:600;font-size:14.5px;text-decoration:none;border-bottom:2px solid var(--teal);}
  .network-invite-link:hover{color:var(--navy-deep);}

  footer.foot{
    text-align:center;font-size:12px;color:#9098A6;margin-top:40px;line-height:1.6;
  }
  footer.foot a{color:#9098A6;}

  /* Fixed-shell layout: header, banner, progress bar, and the question
     itself all stay in place; only the answer options scroll. Active only
     while a question is showing — landing and results keep normal page
     scroll, since they don't have this back/forth-per-question pattern. */
  body.question-mode{overflow:hidden;height:100vh;}
  body.question-mode .wrap{height:100vh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:16px;}
  body.question-mode footer.foot{display:none;}
  body.question-mode header.brand{flex-shrink:0;}
  body.question-mode .progress-track{position:static;flex-shrink:0;}
  body.question-mode #app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  body.question-mode .safety-banner{flex-shrink:0;}
  body.question-mode .card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  body.question-mode .banner{flex-shrink:0;}
  body.question-mode .card-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-bottom:18px;}
  .card-fixed{flex-shrink:0;}
  body.question-mode .options-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:2px;}
  body.question-mode .nav-row{flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="mark">B</div>
    <div class="name">Bullyproof.Guide</div>
  </header>

  <div class="progress-track" id="progressTrack" style="display:none;" role="progressbar" aria-label="Assessment progress">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div id="app"></div>

  <footer class="foot">© Bullyproof.Guide — This tool does not replace professional help. If your child is in immediate danger, call 911.<br>Are you a helping professional? <a href="https://www.bullyproof.support/join">Join the Bullyproof Support network</a></footer>
</div>

<script src="config.js"></script>
<script src="assessment-data.js"></script>
<script src="app.js"></script>
</body>
</html>
