<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BullyProof Assessment — Get Clarity On What's Happening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#E8F4FD;
    --text:#2C5282;
    --accent:#4299E1;
    --white:#FFFFFF;
    --danger:#C53030;
    --danger-bg:#FDEDED;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.5;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:24px 20px 80px;
    min-height:100vh;
  }
  header.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0 20px;
  }
  header.brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;
  }
  header.brand .name{font-weight:700;font-size:17px;color:var(--text);}

  .progress-track{
    position:sticky;top:0;
    background:var(--bg);
    padding:10px 0 16px;
    z-index:20;
  }
  .progress-bar{
    height:8px;border-radius:5px;background:#CFE6F8;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--accent);border-radius:5px;
    transition:width .35s ease;
  }
  .progress-label{font-size:13px;color:var(--accent);margin-top:6px;}

  .card{
    background:var(--white);
    border-radius:14px;
    padding:28px 24px;
    margin-top:8px;
    box-shadow:0 1px 3px rgba(44,82,130,0.08);
  }

  h1{font-size:26px;line-height:1.25;margin:0 0 12px;color:var(--text);}
  h2.question{font-size:22px;line-height:1.3;margin:0 0 6px;color:var(--text);}
  p.sub{font-size:16px;color:#4A6D93;margin:0 0 20px;}
  p.body-text{font-size:16px;}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .option-btn{
    text-align:left;
    padding:14px 16px;
    min-height:44px;
    border-radius:10px;
    border:2px solid #CFE6F8;
    background:#fff;
    font-size:16px;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
  }
  .option-btn:hover{border-color:var(--accent);}
  .option-btn.selected{border-color:var(--accent);background:#EAF5FF;font-weight:600;}

  .subsection{margin-top:22px;padding-top:18px;border-top:1px solid #E1EEF9;}
  .subsection h3{font-size:17px;margin:0 0 10px;color:var(--text);}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:26px;
  }
  button.primary{
    background:var(--accent);color:#fff;border:none;
    padding:13px 22px;border-radius:10px;font-size:16px;font-weight:600;
    min-height:44px;cursor:pointer;font-family:inherit;
  }
  button.primary:disabled{background:#A9C9E8;cursor:not-allowed;}
  button.ghost{
    background:transparent;border:none;color:var(--accent);
    font-size:15px;padding:10px;cursor:pointer;font-family:inherit;min-height:44px;
  }

  input[type=email],input[type=number],input[type=text]{
    width:100%;padding:13px 14px;border-radius:10px;border:2px solid #CFE6F8;
    font-size:16px;font-family:inherit;color:var(--text);
  }
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}

  .safety-banner{
    background:var(--danger-bg);
    border:1px solid #F2B8B8;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
  }
  .safety-banner h3{color:var(--danger);margin:0 0 8px;font-size:18px;}
  .safety-banner p{margin:0 0 10px;font-size:15px;color:#7A2E2E;}
  .safety-banner ul{margin:0;padding-left:20px;font-size:15px;color:#7A2E2E;}
  .safety-banner li{margin-bottom:4px;}
  .safety-banner a{color:var(--danger);font-weight:600;}

  .privacy-note{font-size:13px;color:#6B89AB;margin-top:24px;line-height:1.5;}
  .privacy-note a{color:var(--accent);}

  .checkbox-row{
    display:flex;align-items:flex-start;gap:10px;padding:12px 4px;
  }
  .checkbox-row input{width:20px;height:20px;margin-top:2px;flex-shrink:0;}
  .checkbox-row label{font-size:16px;}

  .results-summary{
    background:#EAF5FF;border-radius:12px;padding:18px;margin-bottom:20px;
  }
  .results-summary h3{margin:0 0 6px;font-size:18px;}

  footer.foot{
    text-align:center;font-size:12px;color:#8FAECB;margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="mark">BP</div>
    <div class="name">Bullyproof.Guide</div>
  </header>

  <div class="progress-track" id="progressTrack" style="display:none;">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div id="app"></div>

  <footer class="foot">© Bullyproof.Guide — This tool does not replace professional help. If your child is in immediate danger, call 911.</footer>
</div>

<script src="config.js"></script>
<script src="assessment-data.js"></script>
<script src="app.js"></script>
</body>
</html>
