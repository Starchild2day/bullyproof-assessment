<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bullyproof.Guide — Get Clarity On What's Happening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#101B33;
    --gold:#C89B3C;
    --gold-soft:#EFDFB8;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --text:#1F2430;
    --text-muted:#5B6472;
    --border:#E1E4EA;
    --danger:#B23A48;
    --danger-bg:#FBEAEA;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    font-family:'DM Sans',system-ui,sans-serif;
    background:
      radial-gradient(1100px 620px at 50% -8%, rgba(27,42,74,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(200,155,60,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:24px 20px 80px;
    min-height:100vh;
  }
  header.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0 22px;
  }
  header.brand .mark{
    width:36px;height:36px;border-radius:9px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-weight:700;font-size:15px;
    font-family:'DM Sans',sans-serif;
  }
  header.brand .name{font-weight:600;font-size:17px;color:var(--navy);letter-spacing:-0.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  header.brand .mark{flex-shrink:0;}
  .lang-toggle{margin-left:auto;flex-shrink:0;white-space:nowrap;display:inline-flex;border:1px solid rgba(27,42,74,0.28);border-radius:999px;overflow:hidden;background:#fff;}
  .lang-toggle button{border:0;background:transparent;color:var(--navy);font:600 13px/1 'DM Sans',sans-serif;padding:8px 13px;min-height:32px;cursor:pointer;}
  .lang-toggle button.on{background:var(--navy);color:#fff;}
  .lang-toggle button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}

  .progress-track{
    position:-webkit-sticky;
    position:sticky;top:0;
    background:var(--bg);
    padding:10px 0 16px;
    z-index:20;
  }
  .progress-bar{
    height:9px;border-radius:5px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));border-radius:5px;
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{font-size:13px;color:var(--text-muted);margin-top:8px;}

  .card{
    background:var(--card);
    border-radius:16px;
    margin-top:8px;
    overflow:hidden;
    box-shadow:0 2px 16px rgba(27,42,74,0.08);
    border:1px solid var(--border);
    animation:cardIn .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .card-body{padding:26px 24px 24px;}

  .banner{
    width:100%;height:84px;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .banner.landing-banner{height:130px;}
  /* On the landing screen the logo lives in the banner, so the header shows only the language button. */
  body.landing-mode header.brand{padding:0 0 10px;justify-content:flex-end;}
  body.landing-mode header.brand .mark, body.landing-mode header.brand .name{display:none;}
  body.landing-mode .wrap{padding-top:8px;}
  .banner svg{width:100%;height:100%;position:relative;z-index:1;}

  h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:0;font-size:31px;line-height:1.2;margin:0 0 14px;color:var(--navy);}
  h2.question{font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:-0.01em;font-size:23px;line-height:1.32;margin:0 0 14px;color:var(--navy);position:relative;padding-bottom:14px;}
  h2.question::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:3px;background:var(--gold);border-radius:2px;}
  p.sub{font-size:16px;color:var(--text-muted);margin:0 0 20px;}
  p.body-text{font-size:16px;color:var(--text);}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .option-btn{
    text-align:left;
    padding:15px 16px 15px 18px;
    min-height:48px;
    border-radius:11px;
    border:1.5px solid var(--border);
    border-left:4px solid var(--border);
    background:var(--card);
    font-size:16px;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    display:flex;align-items:center;gap:10px;
    transition:border-color .15s ease;
  }
  .option-btn:hover{border-color:var(--navy);border-left-color:var(--navy);}
  .option-btn.selected{border-color:var(--navy);border-left-color:var(--gold);background:#FBFAF6;font-weight:600;}
  .option-btn .check{
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .option-btn.selected .check{background:var(--gold);border-color:var(--gold);animation:popIn .2s cubic-bezier(.34,1.56,.64,1);}
  .option-btn .check svg{width:11px;height:11px;opacity:0;transition:opacity .1s;}
  .option-btn.selected .check svg{opacity:1;stroke:var(--navy-deep);}
  @keyframes popIn{
    from{transform:scale(0.5);}
    to{transform:scale(1);}
  }

  .subsection{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
  .subsection h3{font-family:'DM Sans',sans-serif;font-size:17px;margin:0 0 10px;color:var(--navy);font-weight:600;}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:28px;
  }
  button.primary{
    background:var(--navy);color:#fff;border:none;
    padding:14px 24px;border-radius:10px;font-size:16px;font-weight:600;
    min-height:48px;cursor:pointer;font-family:inherit;
    transition:background .15s ease;
  }
  button.primary:hover:not(:disabled){background:var(--navy-deep);}
  button.primary:disabled{background:#B7BECB;cursor:not-allowed;}
  a.primary-link{
    display:inline-flex;align-items:center;background:var(--navy);color:#fff;text-decoration:none;
    padding:14px 24px;border-radius:10px;font-size:16px;font-weight:600;min-height:48px;
  }
  a.primary-link:hover{background:var(--navy-deep);}
  /* Private plan page: a slim toolbar card, then the plan itself on its own sheet */
  .plan-toolbar .card-body{padding:20px 24px;}
  .plan-kicker{margin:0;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .plan-sheet{margin-top:16px;}
  .plan-sheet img{max-width:100%;height:auto;}
  /* "Help Another Parent" — warm and set apart, but quieter than the plan itself */
  .share-card{margin-top:18px;background:linear-gradient(180deg,#FFFBF3 0%,#FFFFFF 70%);border-color:#EADFC6;text-align:center;}
  .share-card .card-body{padding:28px 24px 24px;}
  .share-icon{width:52px;height:52px;border-radius:50%;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 0 0 4px #F3E6C6;}
  .share-title{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:23px;line-height:1.3;color:var(--navy);margin:0 0 8px;letter-spacing:-0.01em;}
  .share-tag{font-size:16px;font-weight:600;color:#A87C2A;margin:0 0 14px;line-height:1.45;}
  .share-body{font-size:15.5px;color:var(--text);line-height:1.6;margin:0 auto 20px;max-width:460px;}
  .share-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .share-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);padding:13px 22px;border-radius:10px;font-size:16px;font-weight:600;min-height:48px;cursor:pointer;font-family:inherit;}
  .share-secondary:hover{background:#F5F6FB;}
  .share-options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .share-options[hidden]{display:none;}
  .share-opt{background:#F5F6FB;border:1px solid var(--border);color:var(--navy);text-decoration:none;font-size:14.5px;font-weight:600;padding:10px 14px;border-radius:9px;cursor:pointer;font-family:inherit;}
  .share-status{min-height:20px;margin:12px 0 0;font-size:14px;color:#276749;word-break:break-all;}
  .share-privacy{font-size:12.5px;color:var(--text-muted);margin:6px auto 0;max-width:420px;line-height:1.5;}
  .plan-sheet table{max-width:100%;}
  /* The plan was designed 600px wide (email width). On phones, give it a little more room so the
     three-book row with its buttons never pushes past the edge. */
  @media (max-width:560px){
    .plan-sheet > div > div{padding-left:14px !important;padding-right:14px !important;}
    .plan-sheet a[style*="display:inline-block"][style*="padding:8px 14px"]{padding:8px 9px !important;white-space:normal !important;}
    .plan-sheet table[style*="#FFFBF3"] > tbody > tr > td{padding-left:12px !important;padding-right:12px !important;}
    .plan-sheet td[style*="white-space:nowrap"]{white-space:normal !important;}
  }
  button.ghost{
    background:transparent;border:none;color:var(--text-muted);
    font-size:15px;padding:10px;cursor:pointer;font-family:inherit;min-height:44px;font-weight:500;
  }
  button.ghost:hover{color:var(--navy);}

  input[type=email],input[type=number],input[type=text],textarea{
    width:100%;padding:14px 15px;border-radius:10px;border:1.5px solid var(--border);
    font-size:16px;font-family:inherit;color:var(--text);background:var(--card);
  }
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--navy);}

  .safety-banner{
    background:var(--danger-bg);
    border:1px solid #E9C2C6;
    border-left:4px solid var(--danger);
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
  }
  .safety-banner h3{font-family:'DM Sans',sans-serif;color:var(--danger);margin:0 0 8px;font-size:18px;font-weight:700;}
  .safety-banner p{margin:0 0 10px;font-size:15px;color:#7A2E31;}
  .safety-banner ul{margin:0;padding-left:20px;font-size:15px;color:#7A2E31;}
  .safety-banner li{margin-bottom:4px;}
  .safety-banner a{color:var(--danger);font-weight:600;}
  .safety-ack-btn{
    margin-top:12px;background:var(--danger);color:#fff;border:none;
    padding:11px 18px;border-radius:9px;font-size:14.5px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .safety-ack-btn:hover{background:#96303C;}
  .safety-banner-mini{
    padding:12px 16px;font-size:13px;line-height:1.5;color:#7A2E31;
  }
  .safety-banner-mini strong{color:var(--danger);}

  .privacy-note{font-size:13px;color:var(--text-muted);margin-top:24px;line-height:1.5;}
  .privacy-note a{color:var(--navy);}

  .checkbox-row{
    display:flex;align-items:flex-start;gap:10px;padding:14px 4px;
  }
  .checkbox-row input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--navy);}
  .checkbox-row label{font-size:15px;color:var(--text);}

  .results-summary{
    background:var(--gold-soft);border-radius:12px;padding:20px 22px;margin-bottom:20px;
    border-left:4px solid var(--gold);
  }
  .results-summary h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 14px;font-size:21px;color:var(--navy);font-weight:400;}
  .summary-label{font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--navy);opacity:0.65;margin:0 0 4px;}
  .summary-quote{font-family:'DM Sans',sans-serif;font-style:italic;font-weight:500;font-size:16.5px;color:var(--navy-deep);margin:0 0 14px;line-height:1.45;}
  .summary-reflection{font-size:14.5px;color:var(--text);line-height:1.55;margin:0;padding-top:14px;border-top:1px solid rgba(27,42,74,0.12);}

  footer.foot{
    text-align:center;font-size:12px;color:#9098A6;margin-top:40px;line-height:1.6;
  }
  footer.foot a{color:#9098A6;}

  /* Fixed-shell layout: header, banner, progress bar, and the question
     itself all stay in place; only the answer options scroll. Active only
     while a question is showing — landing and results keep normal page
     scroll, since they don't have this back/forth-per-question pattern. */
  /* Questions: the page scrolls normally (never locked to one screen height — on phones the browser's own
     toolbars can cover a locked screen and hide the Next button), and the Back/Next bar stays pinned to the
     bottom of the screen so it's always one tap away, whatever the phone, text size, or browser. */
  body.question-mode .wrap{min-height:0;padding-bottom:0;}
  body.question-mode footer.foot{display:none;}
  body.question-mode .card{overflow:clip;margin-bottom:16px;}
  body.question-mode .card-body{--padx:24px;padding:16px var(--padx) 0;}
  body.question-mode .nav-row{
    position:-webkit-sticky;position:sticky;bottom:0;z-index:15;
    margin:14px calc(-1 * var(--padx)) 0;
    padding:12px var(--padx) calc(12px + env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--border);
    box-shadow:0 -6px 14px -10px rgba(27,42,74,0.35);
  }
  body.question-mode header.brand{flex-shrink:0;padding:6px 0 8px;}
  body.question-mode header.brand .mark{width:26px;height:26px;font-size:12px;}
  body.question-mode header.brand .name{font-size:14px;}
  body.question-mode .lang-toggle button{padding:5px 10px;font-size:12px;min-height:26px;}
  body.question-mode .progress-track{position:static;flex-shrink:0;padding:6px 0 8px;}
  body.question-mode .progress-label{margin-top:5px;}
  body.question-mode h2.question{margin-bottom:8px;padding-bottom:8px;font-size:20px;}
  body.question-mode p.sub{margin-bottom:12px;}
  @media (max-width:420px){ body.question-mode .card-body{--padx:18px;} }

  /* After a safety notice has been read and closed: the banner shrinks to a slim strip at the top of
     the card, the crisis resources sit on one thin line right under it, and the answers get the room. */
  .crisis-line{
    background:var(--danger-bg);color:#7A2E31;border-bottom:1px solid #E9C2C6;
    padding:7px 16px;font-size:13px;line-height:1.45;flex-shrink:0;
  }
  .crisis-line strong{color:var(--danger);}
  .crisis-line a{color:var(--danger);font-weight:700;text-decoration:underline;}
  .crisis-line .sep{color:#C98C93;}
  body.safety-mini .banner{height:44px;flex-shrink:0;}
  body.safety-mini .banner img{width:34px !important;height:34px !important;}
  body.safety-mini .card-body{padding-top:12px;}
  body.safety-mini h2.question{font-size:19px;}
  body.safety-mini p.sub{margin-bottom:8px;}

  /* Short screens (small laptops, phones held sideways): a slimmer banner for everyone. */
  @media (max-height:820px){
    body.question-mode .banner{height:58px;}
    body.question-mode .banner img{width:48px !important;height:48px !important;}
    body.safety-mini .banner{height:44px;}
    body.safety-mini .banner img{width:34px !important;height:34px !important;}
  }
  @media (max-height:700px){
    body.safety-mini header.brand{padding:4px 0 4px;}
    body.safety-mini .progress-track{padding:4px 0 6px;}
    body.safety-mini .card-body{--padx:18px;padding:10px var(--padx) 0;}
    body.safety-mini h2.question{font-size:17px;margin-bottom:6px;padding-bottom:6px;}
    body.safety-mini p.sub{font-size:14px;line-height:1.4;margin-bottom:6px;}
    body.safety-mini .options{margin-top:8px;gap:8px;}
    body.safety-mini .option-btn{padding:11px 14px 11px 16px;font-size:15px;}
    body.safety-mini .crisis-line{padding:5px 12px;font-size:12.5px;}
  }

  /* "Draw the Line" song card at the end of the Action Plan */
  .song-card .song-title{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:26px;color:var(--navy);margin:4px 0 8px;}
  .song-player{display:flex;align-items:center;gap:14px;background:var(--navy);border-radius:14px;padding:12px 14px;}
  .song-play{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:0;background:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;min-height:0;}
  .song-play:focus-visible{outline:3px solid #fff;outline-offset:2px;}
  .song-play .i-play{width:0;height:0;border-left:17px solid var(--navy-deep);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px;}
  .song-play .i-pause{width:15px;height:19px;border-left:5px solid var(--navy-deep);border-right:5px solid var(--navy-deep);}
  .song-mid{flex:1 1 auto;min-width:0;}
  .song-mid input[type=range]{width:100%;accent-color:var(--gold);margin:0;}
  .song-time{font-size:13.5px;color:#D5DAE6;margin-top:2px;}
  .song-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .song-btn{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 16px;font:600 14.5px/1.2 'DM Sans',sans-serif;cursor:pointer;min-height:0;width:auto;}
  .song-btn.on{background:var(--navy);color:#fff;}
  .song-lyrics{margin-top:14px;font-size:16px;line-height:1.6;color:var(--navy-deep);}
  .song-lyrics p{margin:0;}
  .song-lyrics .song-sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6D2E;margin:14px 0 2px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="mark">B</div>
    <div class="name">Bullyproof.Guide</div>
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" lang="en" class="on" aria-pressed="true">English</button>
      <button type="button" data-lang="es" lang="es" aria-pressed="false">Español</button>
    </div>
  </header>

  <div class="progress-track" id="progressTrack" style="display:none;" role="progressbar" aria-label="Assessment progress">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div id="app"></div>

  <footer class="foot" id="siteFooter">© Bullyproof.Guide — This tool does not replace professional help. If your child is in immediate danger, call 911.<br>Are you a helping professional? <a href="https://www.bullyproof.support/join">Join the Bullyproof Support network</a></footer>
</div>

<script src="/config.js?v=20261016a"></script>
<script src="/i18n.js?v=20261016a"></script>
<script src="/assessment-data.js?v=20261016a"></script>
<script src="/assessment-data.es.js?v=20261016a"></script>
<script src="/app.js?v=20261016c"></script>
</body>
</html>
