# Netlify settings for the Bullyproof assessment tool.

[build]
  # Rebuilds the server-side copy of the plan builder from the site's own files on every deploy,
  # so the email the server sends can never drift out of date with the on-screen plan and the PDF.
  command = "node scripts/build-plan-bundle.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The landing page lives at /landing/ and is the ONE official copy (bullyproof.guide/assessment
# redirects here instead of keeping its own copy), so it is open to search engines.

# Basic browser-safety headers on every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Private plan pages: /plan/<ID> shows the same page as the assessment, which loads that saved plan.
[[redirects]]
  from = "/plan/*"
  to = "/index.html"
  status = 200

# Keep plan pages out of search engines, never leak the link to other sites, and never cache them.
[[headers]]
  for = "/plan/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
